name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [ingest, simulator]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o bin/${{ matrix.module }} .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.module }}-linux-amd64
          path: ${{ matrix.module }}/bin/${{ matrix.module }}

  scala:
    name: Scala (analytics)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt -batch test assembly
      - uses: actions/upload-artifact@v7
        with:
          name: analytics-jar
          path: analytics/target/scala-3.3.4/analytics.jar

  e2e:
    name: Prueba end-to-end (docker compose)
    needs: [go, scala]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/e2e.sh e2e-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: e2e-results/

  images:
    name: Imágenes Docker (GHCR)
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [ingest, simulator, analytics]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gamestats-${{ matrix.module }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  # Requiere en el repo: variables DEPLOY_HOST y DEPLOY_USER, secret DEPLOY_SSH_KEY.
  # Si DEPLOY_HOST no está configurado, el job se omite.
  deploy:
    name: Deploy a la VM
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}:9000
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      USER: ${{ vars.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Copiar compose de producción
        run: scp -i ~/.ssh/id_deploy deploy/docker-compose.prod.yml "$USER@$HOST:gamestats/docker-compose.prod.yml"
      - name: Descargar imágenes y levantar servicios
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "cd gamestats && \
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
             export IMAGE_TAG=sha-${GITHUB_SHA::7} && \
             docker compose -f docker-compose.prod.yml pull analytics ingest && \
             docker compose -f docker-compose.prod.yml up -d --remove-orphans analytics ingest && \
             docker logout ghcr.io && \
             docker image prune -f"
      - name: Verificar que el sistema responde
        run: |
          for i in $(seq 30); do
            curl -fs "http://$HOST:9000/health" && curl -fs "http://$HOST:8080/health" && exit 0
            sleep 5
          done
          echo "El sistema no respondió después del deploy" && exit 1
